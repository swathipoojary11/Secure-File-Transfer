# ==============================================================================
# SECURE FILE TRANSFER - DCN BACKEND CONFIGURATION
# ==============================================================================

# Server HTTP Port for Spring Boot REST API
# (Set to 8085 to avoid common developer machine collisions with Jenkins/Tomcat on 8080)
server.port=8085

# Application Name
spring.application.name=secure-file-transfer-backend

# Disable banner for cleaner command-line output during academic demos
spring.main.banner-mode=console

# Maximum file upload limits for local staging REST endpoints (up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom TCP/TLS Transfer Agent Configuration (used in Phase 2 & 3)
tcp.transfer.port=8443
tcp.transfer.chunk-size=65536
tcp.transfer.timeout-ms=30000
tcp.transfer.keystore-password=changeit

# File Storage Directories
app.storage.temp-dir=./storage/temp
app.storage.received-dir=./storage/received
